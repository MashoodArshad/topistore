{% extends 'base.html' %}
{% block title %}Page Not Found — Shah G Cap House{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-5 py-24 text-center">
    <div class="bg-white rounded-3xl border border-slate-200 shadow-xl p-12 relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-2 bg-brand-red"></div>
        
        <h1 class="text-8xl font-black text-brand-dark/10 leading-none">404</h1>
        <h2 class="text-2xl font-black uppercase text-brand-dark tracking-tight -mt-6">Page Not Found</h2>
        <p class="text-sm text-slate-500 mt-4 max-w-md mx-auto leading-relaxed">
            The page you're looking for doesn't exist or has been moved. 
            Let's get you back to our premium collection.
        </p>
        
        <div class="mt-8 flex flex-col sm:flex-row gap-3 justify-center">
            <a href="{% url 'core:home' %}" class="bg-brand-emerald hover:bg-emerald-800 text-white font-extrabold text-xs uppercase tracking-widest py-4 px-8 rounded-xl transition">
                Back to Home
            </a>
            <a href="{% url 'products:product_list' %}" class="bg-brand-dark hover:bg-slate-800 text-white font-extrabold text-xs uppercase tracking-widest py-4 px-8 rounded-xl transition">
                View Collection
            </a>
        </div>
    </div>
</div>
{% endblock %}
